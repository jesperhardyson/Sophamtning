name: Sophamtning
options:
  bundleIdPrefix: se.hardyson
  developmentLanguage: sv
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  SophamtningKit:
    path: Packages/SophamtningKit
# Versionen ligger i en egen fil, så att projektfilen inte ändras vid en release (docs/specs/2026-11-08-release.md).
# fileGroups ger filen ett stabilt id i projektfilen.
fileGroups:
  - Config
configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 4WZU5V58ZG
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
targets:
  Sophamtning:
    type: application
    platform: iOS
    sources:
      - Sophamtning
      # Intenten ska finnas i båda målen, så att knappen körs utan att appen öppnas.
      - path: SophamtningWidgets/MarkPlacedOutIntent.swift
    dependencies:
      - target: SophamtningWidgets
      - package: SophamtningKit
        product: SophamtningKit
      - package: SophamtningKit
        product: SophamtningDesign
    entitlements:
      path: Sophamtning/Sophamtning.entitlements
      properties:
        com.apple.security.application-groups:
          - group.se.hardyson.sophamtning
        # Hushållet synkas med CloudKit (docs/specs/2026-11-09-hushall.md). Push behövs för CKSyncEngines prenumerationer.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.se.hardyson.sophamtning
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    info:
      path: Sophamtning/Info.plist
      properties:
        CFBundleDisplayName: Sophämtning
        # Versionen kommer från Version.xcconfig.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers:
          - se.hardyson.sophamtning.refresh
        UIBackgroundModes:
          - fetch
          # Tyst push när någon i hushållet ändrar något.
          - remote-notification
        # Appen öppnar inbjudningar till ett hushåll (CKShare).
        CKSharingSupported: true
        # Appen använder bara kryptering som ingår i iOS (HTTPS), vilket är undantaget från exportreglerna.
        ITSAppUsesNonExemptEncryption: false
        # Stillbilden som visas direkt vid start. Introt i appen tar över med exakt samma bild.
        UILaunchScreen:
          UIImageName: LaunchLogo
          UIColorName: LaunchBackground
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"  # Bara iPhone, ingen iPad-anpassning (docs/specs/2026-11-06-app-store.md).
        PRODUCT_BUNDLE_IDENTIFIER: se.hardyson.sophamtning
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          # UI-testernas stubb och testdata ingår bara i Debug-bygget.
          EXCLUDED_SOURCE_FILE_NAMES: "*/Sophamtning/UITest/* */Sophamtning/UITestData/*"
  SophamtningWidgets:
    type: app-extension
    platform: iOS
    sources: [SophamtningWidgets]
    dependencies:
      - package: SophamtningKit
        product: SophamtningKit
      - package: SophamtningKit
        product: SophamtningDesign
    entitlements:
      path: SophamtningWidgets/SophamtningWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.se.hardyson.sophamtning
    info:
      path: SophamtningWidgets/Info.plist
      properties:
        CFBundleDisplayName: Sophämtning
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"  # Bara iPhone, ingen iPad-anpassning (docs/specs/2026-11-06-app-store.md).
        PRODUCT_BUNDLE_IDENTIFIER: se.hardyson.sophamtning.widgets
  SophamtningUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SophamtningUITests]
    dependencies:
      - target: Sophamtning
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"  # Bara iPhone, ingen iPad-anpassning (docs/specs/2026-11-06-app-store.md).
        PRODUCT_BUNDLE_IDENTIFIER: se.hardyson.sophamtning.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Sophamtning
schemes:
  Sophamtning:
    build:
      targets:
        Sophamtning: all
    test:
      targets:
        - SophamtningUITests
