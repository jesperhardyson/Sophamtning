name: Server

# Brevlådan för hushåll i Server/. Testerna körs i varje PR som ändrar den, och på main driftsätts den hos Cloudflare.
# Kontrollen är inte obligatorisk, så filtret kan ligga i on:. Se docs/specs/2026-11-23-hushall-mellan-plattformar.md.
on:
  pull_request:
    branches: [main]
    paths: ["Server/**", ".github/workflows/server.yml"]
  push:
    branches: [main]
    paths: ["Server/**", ".github/workflows/server.yml"]

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Inga installationsskript behövs: programfilerna kommer som egna paket.
      - run: npm ci --ignore-scripts

      - run: npm test

      # Apparna testas mot en kopia av samma vektorer. Skiljer de sig har formatet ändrats på bara ett ställe.
      - name: Samma testvektorer som i apparna
        run: cmp test/vectors.json ../iOS/Packages/SophamtningKit/Tests/SophamtningKitTests/Fixtures/hushall-vectors.json

      - name: Driftsätt
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Brevlådan driftsattes inte: CLOUDFLARE_API_TOKEN eller CLOUDFLARE_ACCOUNT_ID saknas."
            exit 0
          fi
          npx wrangler deploy
