name: Release

# Release Please håller en release-PR per app med nästa version. När den mergas skapas appens tagg och en GitHub Release.
# En iOS-release startar jobbet TestFlight, som väntar på Jespers godkännande i miljön testflight, och en Android-release
# startar jobbet Google Play, som väntar i miljön googleplay. Startas workflowen för hand rörs bara den valda appen: med
# en tagg görs uppladdningen om, och utan tagg blir det ett testbygge från den valda grenen.
# Se docs/specs/2026-11-08-release.md och docs/android-google-play.md.
#
# Vilket jobb som körs:
#
# | Händelse                                  | TestFlight | Google Play |
# |-------------------------------------------|------------|-------------|
# | push till main utan release               | nej        | nej         |
# | push, release-PR för ios mergad           | ja         | nej         |
# | push, release-PR för android mergad       | nej        | ja          |
# | push, båda mergade i samma push           | ja         | ja          |
# | för hand, app ios, med tagg ios-v…        | ja (igen)  | nej         |
# | för hand, app ios, utan tagg              | testbygge  | nej         |
# | för hand, app android, med tagg android-v…| nej        | ja (igen)   |
# | för hand, app android, utan tagg          | nej        | testbygge   |
#
# En tagg som inte hör till den valda appen stoppar jobbet i steget Version.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: "Appen som byggs. Bara den rörs."
        type: choice
        options: [ios, android]
        required: true
        default: ios
      tag:
        description: "Befintlig tagg att ladda upp igen, till exempel ios-v1.4.0, v1.3.1 eller android-v1.0.0. Lämna tomt för ett testbygge från grenen ovan."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      ios_release_created: ${{ steps.release.outputs['iOS--release_created'] }}
      ios_tag_name: ${{ steps.release.outputs['iOS--tag_name'] }}
      android_release_created: ${{ steps.release.outputs['Android--release_created'] }}
      android_tag_name: ${{ steps.release.outputs['Android--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  testflight:
    needs: release-please
    # Körs bara när en iOS-release skapades, eller för hand med appen ios: med en befintlig tagg, eller utan tagg för ett
    # testbygge.
    if: >-
      !cancelled() && (
        (github.event_name == 'push' && needs.release-please.outputs.ios_release_created == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.app == 'ios')
      )
    runs-on: macos-26
    timeout-minutes: 75
    environment: testflight
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.ios_tag_name }}
      TEST_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
    steps:
      # Testbygget tar grenens commit. Hela historiken och taggarna behövs för texten i TestFlight.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Xcode 26.6 är senaste stabila Xcode på macos-26 och har iOS 26-SDK.
      - name: Välj Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Paketets tester
        working-directory: iOS/Packages/SophamtningKit
        run: swift test --skip ContractTests

      - name: Paketets tester i annan tidszon
        working-directory: iOS/Packages/SophamtningKit
        run: TZ=America/New_York swift test --skip ContractTests

      # Byggnumret ökar alltid, också när en körning görs om.
      - name: Byggnummer
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} * 100 + ${{ github.run_attempt }} ))" >> "$GITHUB_ENV"

      # En release har taggens version, från ios-vX.Y.Z eller en äldre vX.Y.Z. Ett testbygge får nästa patchversion efter
      # iOS/version.txt, som bara sätts i bygget.
      - name: Version
        run: |
          if [ "$TEST_BUILD" = "true" ]; then
            IFS=. read -r major minor patch < iOS/version.txt
            version="$major.$minor.$((patch + 1))"
          else
            case "$TAG" in
              ios-v*|v*) ;;
              *) echo "::error::Taggen $TAG hör inte till iOS. Välj appen android för en android-v-tagg."; exit 1 ;;
            esac
            version="${TAG#ios-}"
            version="${version#v}"
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      # Nyckeln läses från env och skrivs till en fil som tas bort i sista steget. Den skrivs aldrig ut.
      - name: App Store Connect-nyckel
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      # CI har ett eget sparat utvecklingscertifikat, som läses in i en tillfällig nyckelring. Utan det skapar automatisk
      # signering ett nytt Apple Development-certifikat på varje ny runner, tills kontot når Apples tak. Distributionen
      # signeras som förut med det molnhanterade certifikatet vid exporten. Se docs/specs/2026-11-08-release.md.
      - name: Utvecklingscertifikat
        env:
          DEV_CERT_P12: ${{ secrets.DEV_CERT_P12 }}
          DEV_CERT_PASSWORD: ${{ secrets.DEV_CERT_PASSWORD }}
        run: |
          if [ -z "$DEV_CERT_P12" ] || [ -z "$DEV_CERT_PASSWORD" ]; then
            echo "::error::DEV_CERT_P12 och DEV_CERT_PASSWORD saknas i miljön testflight."
            exit 1
          fi
          keychain="$RUNNER_TEMP/ci.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$DEV_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dev.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/dev.p12" -P "$DEV_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/dev.p12"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

      - name: Arkivera
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          echo "Version $APP_VERSION, byggnummer $BUILD_NUMBER, testbygge $TEST_BUILD"
          xcodebuild archive \
            -project iOS/Sophamtning.xcodeproj -scheme Sophamtning -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/Sophamtning.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Ladda upp till App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Sophamtning.xcarchive" \
            -exportOptionsPlist iOS/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # Versionens avsnitt ur changelogen blir "Vad ska testas" i TestFlight. Ett testbygge får grenen, commiten och
      # commit-rubrikerna för iOS sedan senaste taggen. Steget väntar tills Apple har bearbetat bygget. Misslyckas det är
      # uppladdningen ändå klar, och texten kan läggas in för hand.
      - name: Vad ska testas och Nyheter
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$TEST_BUILD" = "true" ]; then
            last_tag="$(git describe --tags --abbrev=0 --match 'ios-v*' --match 'v*' 2>/dev/null || true)"
            {
              echo "Testbygge från $GITHUB_REF_NAME ($(git rev-parse --short HEAD))"
              echo
              git log --no-merges --format='* %s' ${last_tag:+"$last_tag..HEAD"} -- iOS scripts | sed -E 's/ \(#[0-9]+\)$//'
            } > "$RUNNER_TEMP/notes.md"
          else
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > "$RUNNER_TEMP/notes.md"
          fi
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pyjwt==2.13.0" "cryptography==49.0.0"
          "$RUNNER_TEMP/venv/bin/python" scripts/release_notes.py testflight \
            --version "$APP_VERSION" --build "$BUILD_NUMBER" --notes-file "$RUNNER_TEMP/notes.md"
          # Utkast till "Nyheter i den här versionen", om App Store-versionen redan finns. Annars görs det senare
          # med workflowen App Store-text. Testbyggen går bara till TestFlight.
          if [ "$TEST_BUILD" != "true" ]; then
            "$RUNNER_TEMP/venv/bin/python" scripts/release_notes.py appstore \
              --version "$APP_VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Ta bort nyckeln och certifikatet
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/dev.p12"
          if [ -n "${KEYCHAIN_PATH:-}" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi

      # Arkivet med dSYM sparas för att kunna symbolisera kraschrapporter, också när uppladdningen fallerar.
      - name: Spara arkivet
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sophamtning-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/Sophamtning.xcarchive
          if-no-files-found: ignore
          retention-days: 30

  googleplay:
    needs: release-please
    # Körs bara när en Android-release skapades, eller för hand med appen android: med en befintlig tagg, eller utan tagg
    # för ett testbygge.
    if: >-
      !cancelled() && (
        (github.event_name == 'push' && needs.release-please.outputs.android_release_created == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.app == 'android')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: googleplay
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.android_tag_name }}
      TEST_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
    steps:
      # Testbygget tar grenens commit. Hela historiken och taggarna behövs för "Vad är nytt".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # Cachen bara läses här, så att inget från ett jobb med nyckeln sparas till andra körningar.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      # versionCode räknas som byggnumret på iOS, i samma workflow. Den ökar alltid, också när en körning görs om, och
      # ett testbygge och en release får aldrig samma nummer. En release har taggens version, från android-vX.Y.Z. Ett
      # testbygge får nästa patchversion efter Android/version.txt, som bara sätts i bygget.
      - name: Version
        run: |
          if [ "$TEST_BUILD" = "true" ]; then
            IFS=. read -r major minor patch < Android/version.txt
            version="$major.$minor.$((patch + 1))"
          else
            case "$TAG" in
              android-v*) ;;
              *) echo "::error::Taggen $TAG hör inte till Android. Välj appen ios för en ios-v-tagg."; exit 1 ;;
            esac
            version="${TAG#android-v}"
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( ${{ github.run_number }} * 100 + ${{ github.run_attempt }} ))" >> "$GITHUB_ENV"

      # Fallerar testerna laddas inget upp. De körs innan nyckeln finns på runnern.
      - name: Tester
        working-directory: Android
        run: ./gradlew :core:test :app:testDebugUnitTest

      # Nyckeln och tjänstkontot läses från env och skrivs till filer som tas bort i ett av de sista stegen. De skrivs
      # aldrig ut. Båda secrets är base64-kodade filer.
      - name: Uppladdningsnyckel och tjänstkonto
        env:
          SOPHAMTNING_UPLOAD_KEYSTORE: ${{ secrets.SOPHAMTNING_UPLOAD_KEYSTORE }}
          SOPHAMTNING_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.SOPHAMTNING_UPLOAD_KEYSTORE_PASSWORD }}
          SOPHAMTNING_UPLOAD_KEY_ALIAS: ${{ secrets.SOPHAMTNING_UPLOAD_KEY_ALIAS }}
          SOPHAMTNING_UPLOAD_KEY_PASSWORD: ${{ secrets.SOPHAMTNING_UPLOAD_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          for name in SOPHAMTNING_UPLOAD_KEYSTORE SOPHAMTNING_UPLOAD_KEYSTORE_PASSWORD SOPHAMTNING_UPLOAD_KEY_ALIAS \
            SOPHAMTNING_UPLOAD_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::De här secrets saknas i miljön googleplay:$missing. Se docs/android-google-play.md."
            exit 1
          fi
          umask 077
          printf '%s' "$SOPHAMTNING_UPLOAD_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | base64 --decode > "$RUNNER_TEMP/play.json"

      # Utan konfigurationscache, så att lösenorden inte sparas i Gradles cache på runnern.
      - name: Bygg AAB
        working-directory: Android
        env:
          SOPHAMTNING_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          SOPHAMTNING_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.SOPHAMTNING_UPLOAD_KEYSTORE_PASSWORD }}
          SOPHAMTNING_UPLOAD_KEY_ALIAS: ${{ secrets.SOPHAMTNING_UPLOAD_KEY_ALIAS }}
          SOPHAMTNING_UPLOAD_KEY_PASSWORD: ${{ secrets.SOPHAMTNING_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "Version $APP_VERSION, versionCode $VERSION_CODE, testbygge $TEST_BUILD"
          ./gradlew --no-configuration-cache :app:bundleRelease \
            -PversionCode="$VERSION_CODE" -PversionName="$APP_VERSION"

      # Versionens avsnitt ur changelogen blir "Vad är nytt". Ett testbygge får grenen, commiten och commit-rubrikerna
      # för Android sedan senaste android-v-taggen. play_upload.py gör texten ren och kortar den till 500 tecken.
      - name: Vad är nytt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$TEST_BUILD" = "true" ]; then
            last_tag="$(git describe --tags --abbrev=0 --match 'android-v*' 2>/dev/null || true)"
            {
              echo "Testbygge från $GITHUB_REF_NAME ($(git rev-parse --short HEAD))"
              echo
              git log --no-merges --format='* %s' ${last_tag:+"$last_tag..HEAD"} -- Android scripts | sed -E 's/ \(#[0-9]+\)$//'
            } > "$RUNNER_TEMP/notes.md"
          else
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > "$RUNNER_TEMP/notes.md"
          fi

      - name: Ladda upp till Google Play
        env:
          PLAY_SERVICE_ACCOUNT_PATH: ${{ runner.temp }}/play.json
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "google-auth==2.63.1" "requests==2.34.2"
          "$RUNNER_TEMP/venv/bin/python" scripts/play_upload.py upload \
            --aab Android/app/build/outputs/bundle/release/app-release.aab \
            --track internal --notes-file "$RUNNER_TEMP/notes.md" --package se.hardyson.sophamtning

      - name: Ta bort nyckeln och tjänstkontot
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/play.json"

      # AAB:n och mapping-filen sparas för att kunna läsa kraschrapporter, också när uppladdningen fallerar.
      - name: Spara AAB och mapping
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sophamtning-Android-${{ env.APP_VERSION }}-${{ env.VERSION_CODE }}
          path: |
            Android/app/build/outputs/bundle/release/app-release.aab
            Android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 30
