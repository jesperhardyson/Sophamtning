name: iOS

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Avgör om iOS har ändrats. Filtret ligger inte i on:, eftersom regeluppsättningen kräver kontrollen test: en workflow
  # som aldrig startar lämnar kontrollen hängande, medan ett jobb som hoppas över med if räknas som godkänt.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ändrade filer
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE" HEAD)
          echo "$files"
          if echo "$files" | grep -qE '^(iOS/|scripts/|\.github/workflows/(ios|release)\.yml$|release-please-config\.json$|\.release-please-manifest\.json$)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    # Hoppas bara över när changes säger nej. Fallerar changes körs testerna ändå, så att inget mergas otestat.
    if: ${{ !cancelled() && needs.changes.outputs.ios != 'false' }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Xcode 26.6 är senaste stabila Xcode på macos-26 och har iOS 26-SDK.
      - name: Välj Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Releaseskriptens tester
        run: python3 -m unittest discover -s scripts

      - name: Paketets tester
        working-directory: iOS/Packages/SophamtningKit
        run: swift test --skip ContractTests

      # Planeraren får inte bero på telefonens tidszon.
      - name: Paketets tester i annan tidszon
        working-directory: iOS/Packages/SophamtningKit
        run: TZ=America/New_York swift test --skip ContractTests

      - name: Bygg appen
        working-directory: iOS
        run: |
          # iPhone 17 Pro om den finns, annars första tillgängliga iPhone.
          DEVICES=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | .name]')
          NAME=$(echo "$DEVICES" | jq -r 'if index("iPhone 17 Pro") then "iPhone 17 Pro" else .[0] end')
          echo "Simulator: $NAME"
          xcodebuild -project Sophamtning.xcodeproj -scheme Sophamtning \
            -destination "platform=iOS Simulator,name=$NAME" \
            CODE_SIGNING_ALLOWED=NO build
