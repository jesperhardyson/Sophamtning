name: iOS

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Xcode 26.6 är senaste stabila Xcode på macos-26 och har iOS 26-SDK.
      - name: Välj Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Releaseskriptens tester
        run: python3 -m unittest discover -s scripts

      - name: Paketets tester
        working-directory: iOS/Packages/SophamtningKit
        run: swift test --skip ContractTests

      # Planeraren får inte bero på telefonens tidszon.
      - name: Paketets tester i annan tidszon
        working-directory: iOS/Packages/SophamtningKit
        run: TZ=America/New_York swift test --skip ContractTests

      - name: Bygg appen
        working-directory: iOS
        run: |
          # iPhone 17 Pro om den finns, annars första tillgängliga iPhone.
          DEVICES=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | .name]')
          NAME=$(echo "$DEVICES" | jq -r 'if index("iPhone 17 Pro") then "iPhone 17 Pro" else .[0] end')
          echo "Simulator: $NAME"
          xcodebuild -project Sophamtning.xcodeproj -scheme Sophamtning \
            -destination "platform=iOS Simulator,name=$NAME" \
            CODE_SIGNING_ALLOWED=NO build
